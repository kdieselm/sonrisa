server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS: re-resolve "api" so a recreated API container is found without restarting nginx.
    resolver 127.0.0.11 valid=10s;

    # The API keeps the /api prefix: no URI after the upstream (architecture §1),
    # so the browser sees one origin and the API needs no CORS.
    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: client-side routes such as /login load index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
