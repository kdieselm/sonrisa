# docker compose up --build   (copy .env.example to .env first)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1: check over TCP, so the temporary socket-only server of the first init does not count as ready.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "${MAILPIT_UI_PORT}:8025"

  api:
    build: ./src/backend
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD}
      # Demo user for the end-to-end run (skipped when SEED_DEMO_EMAIL is empty). A real SLACK_WEBHOOK_URL makes its
      # Slack destination a real webhook; empty = the local mock receiver.
      Seed__DemoEmail: ${SEED_DEMO_EMAIL:-}
      Seed__DemoPassword: ${SEED_DEMO_PASSWORD:-}
      Seed__DemoSlackWebhookUrl: ${SLACK_WEBHOOK_URL:-}
      Channels__Email__Host: ${SMTP_HOST}
      Channels__Email__Port: ${SMTP_PORT}
      Channels__Email__From: ${SMTP_FROM}
      Channels__Slack__MockEnabled: "true"
      # Alert links in messages point at the web app as the browser reaches it.
      Delivery__PublicBaseUrl: "http://localhost:${WEB_PORT}"
      # New Slack destinations default to the mock receiver in the API itself, reached by its service name.
      Channels__Slack__MockBaseUrl: "http://api:8080/mock/slack"
    ports:
      - "${API_PORT}:8080"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    build: ./src/frontend
    ports:
      - "${WEB_PORT}:80"
    restart: unless-stopped
    depends_on:
      - api

volumes:
  db-data:
